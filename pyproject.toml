[project]
name = "purr"
version = "0.1.0"
description = "Streaming speech-to-text: Quail enhancement + local Whisper/Moonshine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # `stt` extra pulls fastrtc-moonshine-onnx + onnxruntime; the optional
    # PURR_ASR_ENGINE=moonshine backend needs them. The default faster-whisper
    # backend is listed separately below.
    "fastrtc[stt]==0.0.34",
    # Must match `sdk_version` in README.md; the Space build installs
    # `gradio[oauth,mcp]==<sdk_version>` and fastrtc 0.0.34 caps gradio<6.
    "gradio==5.50.0",
    "aic-sdk==3.2.0",
    "faster-whisper>=1.1.0",
    "huggingface_hub>=1.33.0",
    "librosa>=0.11",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scipy>=1.13",
]

# This is an application, not a distributable package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ANN"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
